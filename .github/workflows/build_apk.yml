name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:        # дозволяє запускати вручну

permissions:
  contents: write          # дозволяє створювати Release

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Клон репозиторію
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2️⃣ JDK 17 (потрібен для Android)
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      # 3️⃣ Android SDK
      - name: Install Android SDK
        uses: android-actions/setup-android@v4   # оновлена версія

      # 4️⃣ **Очистка** старих артефактів
      - name: Clean build directory
        run: ./gradlew clean

      # 5️⃣ **Gradle без wrapper** – сам завантажує потрібну версію
      - name: Set up Gradle
        uses: gradle/gradle-build-action@v2
        with:
          gradle-version: "8.10"
          arguments: "assembleDebug --stacktrace --info"
          gradle-executable: "gradle"

      # 6️⃣ Завантажити готовий APK як артефакт
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: app/build/outputs/apk/debug/*.apk